# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # The root manifest and yarn.lock cover every workspace
    schedule:
      interval: "monthly"
    target-branch: "main"
    labels:
      - "type: dependencies"
    # Create PRs for security updates only
    open-pull-requests-limit: 0

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    labels:
      - "Github Actions"
    # Create PRs for security updates only
    open-pull-requests-limit: 0

  # Maintain the Terraform provider pins in the infra lock files
  - package-ecosystem: "terraform"
    directories:
      - "/infra/bootstrap"
      - "/infra/envs/staging/*"
      - "/infra/envs/example/*"
      - "/infra/envs/scratch/*"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 1
    # The Supabase provider is pinned exactly and raised by hand together with a new reading of its source (infra/envs/staging/supabase/README.md § Traps)
    ignore:
      - dependency-name: "supabase/supabase"

  # Maintain the image digest pins of the local proxy stack
  - package-ecosystem: "docker-compose"
    directory: "/infra/local"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 1

  # Maintain the base image digest pin of the frontend image
  - package-ecosystem: "docker"
    directory: "/apps/frontend"
    schedule:
      interval: "monthly"
    target-branch: "main"
    open-pull-requests-limit: 1
