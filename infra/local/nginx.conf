# Stands in for a load balancer in append mode in front of the frontend container: it adds the peer's address to
# X-Forwarded-For, keeps the Host the client sent and names the scheme the client used.
server {
  listen 8080;

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A request body is passed on as it arrives, so a slow upload is in flight at the Node server and not held here.
    proxy_request_buffering off;
  }
}
