# Reverse-proxy topology compose
# Purpose: run the frontend production image behind a reverse proxy that appends to X-Forwarded-For and keeps Host, to check ORIGIN, ADDRESS_HEADER and XFF_DEPTH as a deployment sets them
# Usage: infra/local/check-proxy-topology.sh --out <dir> (the scripted check), or by hand: docker compose --env-file /dev/null -f infra/local/docker-compose.proxy.yml up --build
# Prerequisites: Docker, and the proxy image below present locally (docker pull <the reference>); a login through the proxy also needs a Supabase API the container can reach, named by PROXY_CHECK_SUPABASE_URL
name: openvaa-proxy-check
services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        # Taken from the environment of the caller. When it is not set there, the build gets no argument and the build id is time-based.
        - BUILD_SHA
    # No port is published: the server is reached through the proxy only.
    stop_grace_period: 45s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ORIGIN: ${PROXY_CHECK_ORIGIN:-http://vaa.example.test:8181}
      ADDRESS_HEADER: ${PROXY_CHECK_ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${PROXY_CHECK_XFF_DEPTH:-1}
      # The default names a closed port: the server starts, and every read of the backend fails.
      PUBLIC_SUPABASE_URL: ${PROXY_CHECK_SUPABASE_URL:-http://127.0.0.1:9}
      PUBLIC_SUPABASE_ANON_KEY: ${PROXY_CHECK_SUPABASE_ANON_KEY:-unset-anon-key}
      PUBLIC_PROJECT_ID: ${PROXY_CHECK_PROJECT_ID:-00000000-0000-0000-0000-000000000001}
      DEPLOYMENT_DIAGNOSTICS: ${PROXY_CHECK_DIAGNOSTICS:-}
  proxy:
    # Pinned by digest, never by tag: nginx:stable-alpine, which is nginx 1.30.5.
    image: nginx@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Bound to the loopback address, so the stack is not reachable from another machine.
      - "127.0.0.1:${PROXY_CHECK_PORT:-8181}:8080"
    depends_on:
      - frontend
