# Production build test compose
# Purpose: verify the frontend production Dockerfile builds and runs correctly
# Usage: docker compose -f docker-compose.dev.yml up --build
# Prerequisites: supabase start (for backend services)
services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:-http://host.docker.internal:54321}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      PUBLIC_PROJECT_ID: ${PUBLIC_PROJECT_ID:-00000000-0000-0000-0000-000000000001}
      PUBLIC_BROWSER_FRONTEND_URL: ${PUBLIC_BROWSER_FRONTEND_URL:-http://localhost:3000}
      PUBLIC_SERVER_FRONTEND_URL: ${PUBLIC_SERVER_FRONTEND_URL:-http://localhost:3000}
      PUBLIC_DEBUG: ${PUBLIC_DEBUG:-false}
      PUBLIC_LOG_LEVEL: ${PUBLIC_LOG_LEVEL:-warn}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-none}
      ANALYTICS_CONSENT_MODE: ${ANALYTICS_CONSENT_MODE:-gated}
      ANALYTICS_VISIT_ID_MODE: ${ANALYTICS_VISIT_ID_MODE:-memory}
      ANALYTICS_POSTHOG_KEY: ${ANALYTICS_POSTHOG_KEY:-}
      ANALYTICS_POSTHOG_HOST: ${ANALYTICS_POSTHOG_HOST:-https://eu.i.posthog.com}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}
      XFF_DEPTH: ${XFF_DEPTH:-1}
