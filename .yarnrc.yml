nodeLinker: node-modules

npmMinimalAgeGate: 7d

# Dependency install scripts stay off. The packages allowed to run theirs are listed under
# `dependenciesMeta.<name>.built: true` in the root package.json.
enableScripts: false

yarnPath: .yarn/releases/yarn-4.18.1.cjs

catalog:
  # Existing entries (updated versions)
  typescript: ^6.0.3
  vitest: ^5.0.2
  '@vitest/browser-playwright': ^5.0.2
  vite: ^8.3.1
  eslint: ^10.11.0
  prettier: ^3.7.4
  tsx: ^4.19.2
  '@typescript-eslint/eslint-plugin': ^8.57.0
  '@typescript-eslint/parser': ^8.57.0
  eslint-plugin-simple-import-sort: ^14.0.0
  eslint-plugin-import-x: ^4.17.1
  '@eslint/js': ^10.0.1
  globals: ^17.12.0
  # New entries (deps shared across 2+ workspaces)
  '@types/node': ^24.19.0
  '@faker-js/faker': ^10.6.0
  '@playwright/test': ^1.63.0
  dotenv: ^17.3.1
  zod: ^4.3.6
  '@sveltejs/kit': ^2.70.3
  svelte: ^5.57.1
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  svelte-check: ^4.4.5
  daisyui: ^5.7.46
  '@tailwindcss/vite': ^4.3.3
  tailwindcss: ^4.3.3
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.0
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
  prettier-plugin-sql: ^0.20.0
  js-yaml: ^5.4.2
  tsup: ^8.5.1
  # Supabase (shared across apps/supabase and packages/supabase-types)
  supabase: ^2.118.0
  '@supabase/supabase-js': ^2.117.2
  '@supabase/ssr': ^0.12.7
